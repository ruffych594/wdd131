<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review form: choose a product, give an overall rating, pick useful features and write a review.">
  <meta name="author" content="Rufaro Chirume">
  <title>Product Review Form</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
  <script src="scripts/footer.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form action="review.html" method="get">
      <p class="note"><span class="req" aria-hidden="true">*</span> Required field</p>

      <div class="field">
        <label for="product">Product Name <span class="req">* <span class="req-text">(Required)</span></span></label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="rating">
        <legend>Overall Rating <span class="req">* <span class="req-text">(Required)</span></span></legend>
        <div class="rating-options">
          <div class="rating-option">
            <input type="radio" id="rating-1" name="rating" value="1" required>
            <label for="rating-1"><span aria-hidden="true">★</span><span class="visually-hidden">1 star</span></label>
          </div>
          <div class="rating-option">
            <input type="radio" id="rating-2" name="rating" value="2" required>
            <label for="rating-2"><span aria-hidden="true">★★</span><span class="visually-hidden">2 stars</span></label>
          </div>
          <div class="rating-option">
            <input type="radio" id="rating-3" name="rating" value="3" required>
            <label for="rating-3"><span aria-hidden="true">★★★</span><span class="visually-hidden">3 stars</span></label>
          </div>
          <div class="rating-option">
            <input type="radio" id="rating-4" name="rating" value="4" required>
            <label for="rating-4"><span aria-hidden="true">★★★★</span><span class="visually-hidden">4 stars</span></label>
          </div>
          <div class="rating-option">
            <input type="radio" id="rating-5" name="rating" value="5" required>
            <label for="rating-5"><span aria-hidden="true">★★★★★</span><span class="visually-hidden">5 stars</span></label>
          </div>
        </div>
      </fieldset>

      <div class="field">
        <label for="install-date">Date of Installation <span class="req">* <span class="req-text">(Required)</span></span></label>
        <input type="date" id="install-date" name="installdate" required>
      </div>

      <fieldset class="features">
        <legend>Which features did you find useful? <em>(Check all that apply)</em></legend>
        <div class="check-option">
          <input type="checkbox" id="feature-durability" name="features" value="durability">
          <label for="feature-durability">Durability</label>
        </div>
        <div class="check-option">
          <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
          <label for="feature-ease">Ease of Use</label>
        </div>
        <div class="check-option">
          <input type="checkbox" id="feature-performance" name="features" value="performance">
          <label for="feature-performance">Performance</label>
        </div>
        <div class="check-option">
          <input type="checkbox" id="feature-design" name="features" value="design">
          <label for="feature-design">Design</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="review">Written Review <span class="optional">(Optional)</span></label>
        <textarea id="review" name="review" rows="6"></textarea>
      </div>

      <div class="field">
        <label for="username">Your Name <span class="optional">(Optional)</span></label>
        <input type="text" id="username" name="username" autocomplete="name">
      </div>

      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Rufaro Chirume</p>
    <p>Last Modification: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
